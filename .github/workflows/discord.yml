on:
  pull_request:
    types: [opened, closed]

jobs:
  notify:
    runs-on: ubuntu-latest
    steps:
      - name: Notify Discord
        run: |
          curl -H "Content-Type: application/json" \
            -d "{\"content\": \"PR event: ${{ github.event.action }} — ${{ github.event.pull_request.title }}\"}" \
            "${{ secrets.DISCORD_WEBHOOK_URL }}"

